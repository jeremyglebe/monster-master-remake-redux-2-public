name: Deploy latest release to Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.prerelease &&
       contains(join(github.event.release.assets.*.name, ','), '-pages.zip'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read repository Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Download latest stable built release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/latest" > release.json
          TAG=$(jq -r '.tag_name' release.json)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          KIND=browser
          if [ -n "$BASE_PATH" ]; then KIND=pages; fi
          ASSET="monster-master-${TAG#v}-$KIND.zip"
          mkdir download
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --pattern SHA256SUMS.txt --dir download
          (cd download && sha256sum --check --ignore-missing SHA256SUMS.txt)
          export ASSET TAG
          python3 - <<'PY'
          import json, os, pathlib, stat, zipfile
          allowed = {'.js', '.css', '.html', '.json', '.svg', '.png', '.jpg', '.jpeg',
                     '.webp', '.ttf', '.woff', '.woff2', '.mp3', '.ogg'}
          with zipfile.ZipFile('download/' + os.environ['ASSET']) as archive:
              for entry in archive.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in entry.filename:
                      raise ValueError('Unsafe archive path')
                  if stat.S_ISLNK(entry.external_attr >> 16):
                      raise ValueError('Links cannot be deployed')
                  if any(p in {'src', 'reference', 'references', 'node_modules', '.git'} for p in path.parts):
                      raise ValueError('Private project files cannot be deployed')
                  if not entry.is_dir() and path.name != '.nojekyll' and path.suffix not in allowed:
                      raise ValueError('Unexpected browser file: ' + entry.filename)
              archive.extractall('site')
          assert pathlib.Path('site/index.html').is_file()
          assert json.loads(pathlib.Path('site/version.json').read_text())['version'] == os.environ['TAG'][1:]
          PY
      - name: Upload built site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
